<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14162A"/>
      <stop offset="100%" stop-color="#0C0D14"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FF9A4D"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1280" y1="0" x2="1280" y2="800"/>
  </g>

  <!-- window chrome -->
  <rect x="120" y="120" width="1360" height="560" rx="16" fill="#1C1F3A" stroke="#2A2F5C" stroke-width="1.5"/>
  <rect x="120" y="120" width="1360" height="56" rx="16" fill="#1C1F3A"/>
  <rect x="120" y="160" width="1360" height="16" fill="#1C1F3A"/>
  <circle cx="156" cy="148" r="7" fill="#FF5F57"/>
  <circle cx="180" cy="148" r="7" fill="#FEBC2E"/>
  <circle cx="204" cy="148" r="7" fill="#28C840"/>
  <text x="800" y="153" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#8893B8">eda_pipeline.py — CSV → Stats → Insights</text>

  <!-- left panel: file / stage list -->
  <g font-family="ui-monospace, monospace" font-size="16" fill="#8893B8">
    <rect x="152" y="204" width="220" height="440" rx="10" fill="#14162A" stroke="#2A2F5C"/>
    <rect x="172" y="228" width="180" height="34" rx="8" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.4"/>
    <text x="188" y="250" fill="#FF9A4D" font-weight="600">01  CSV Ingest</text>
    <rect x="172" y="274" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="296">02  Stats + IQR</text>
    <rect x="172" y="320" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="342">03  Visualize</text>
    <rect x="172" y="366" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="388">04  Claude API</text>
    <rect x="172" y="412" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="434">05  Verify</text>
    <rect x="172" y="458" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="480">06  Report.md</text>
  </g>

  <!-- main chart: bars -->
  <g>
    <rect x="424" y="480" width="56" height="120" rx="6" fill="url(#bar2)"/>
    <rect x="500" y="420" width="56" height="180" rx="6" fill="url(#bar1)"/>
    <rect x="576" y="460" width="56" height="140" rx="6" fill="url(#bar2)"/>
    <rect x="652" y="360" width="56" height="240" rx="6" fill="url(#bar1)"/>
    <rect x="728" y="500" width="56" height="100" rx="6" fill="url(#bar2)"/>
  </g>

  <!-- trend line over bars -->
  <polyline points="452,470 528,410 604,450 680,340 756,480" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="452" cy="470" r="5" fill="#FFFFFF"/>
  <circle cx="528" cy="410" r="5" fill="#FFFFFF"/>
  <circle cx="604" cy="450" r="5" fill="#FFFFFF"/>
  <circle cx="680" cy="340" r="5" fill="#FFFFFF"/>
  <circle cx="756" cy="480" r="5" fill="#FFFFFF"/>

  <!-- scatter cluster -->
  <g fill="#38C0FF" fill-opacity="0.75">
    <circle cx="860" cy="430" r="6"/>
    <circle cx="884" cy="470" r="5"/>
    <circle cx="908" cy="410" r="7"/>
    <circle cx="932" cy="450" r="4"/>
    <circle cx="956" cy="500" r="6"/>
    <circle cx="900" cy="520" r="5"/>
    <circle cx="944" cy="390" r="5"/>
    <circle cx="876" cy="560" r="4"/>
  </g>
  <rect x="836" y="380" width="150" height="204" rx="10" fill="none" stroke="#38C0FF" stroke-opacity="0.25" stroke-dasharray="4 5"/>

  <!-- insight card -->
  <g>
    <rect x="1020" y="380" width="300" height="204" rx="14" fill="#20233F" stroke="#2A2F5C"/>
    <circle cx="1054" cy="416" r="10" fill="#F97316"/>
    <path d="M1049 416 l4 4 l8 -9" stroke="#0C0D14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1076" y="422" font-family="ui-monospace, monospace" font-size="15" fill="#E8ECFF" font-weight="600">Verified Insight</text>
    <text x="1054" y="458" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">"Median value is 3.2x</text>
    <text x="1054" y="480" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">the IQR lower bound,</text>
    <text x="1054" y="502" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">indicating right skew."</text>
    <rect x="1054" y="530" width="90" height="26" rx="13" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.4"/>
    <text x="1099" y="548" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#FF9A4D">0 hallucinated</text>
  </g>

  <!-- title -->
  <text x="800" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#E8ECFF">LM-Assisted Automated EDA Pipeline</text>
</svg>
