<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A2E"/>
      <stop offset="100%" stop-color="#0A0B14"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="30%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="82%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38C0FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38C0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5A4632"/>
      <stop offset="100%" stop-color="#8A6A45"/>
    </linearGradient>
    <linearGradient id="branchYes" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="branchNo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#7C93B8"/>
    </linearGradient>
    <radialGradient id="seal" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFC685"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="sealCool2" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#B9CDE5"/>
      <stop offset="55%" stop-color="#5D77A0"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#glowWarm)"/>
  <rect width="1600" height="800" fill="url(#glowCool)"/>

  <!-- scattered coin/particle texture -->
  <g fill="#F97316" fill-opacity="0.35">
    <circle cx="180" cy="120" r="3"/>
    <circle cx="1420" cy="180" r="4"/>
    <circle cx="1480" cy="620" r="3"/>
    <circle cx="140" cy="620" r="4"/>
    <circle cx="1350" cy="700" r="3"/>
    <circle cx="90" cy="420" r="3"/>
  </g>
  <g fill="#38C0FF" fill-opacity="0.3">
    <circle cx="1500" cy="380" r="3"/>
    <circle cx="1230" cy="110" r="3"/>
    <circle cx="60" cy="220" r="3"/>
  </g>

  <!-- ground line -->
  <ellipse cx="430" cy="708" rx="260" ry="18" fill="#000000" opacity="0.35" filter="url(#soft)"/>

  <!-- tree trunk -->
  <path d="M410 700 C405 620, 415 560, 430 500 C440 460, 425 430, 430 400"
        stroke="url(#trunk)" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- root label -->
  <rect x="330" y="640" width="200" height="46" rx="23" fill="#1C1F3A" stroke="#3A3F66" stroke-width="1.5"/>
  <text x="430" y="669" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#E8ECFF" font-weight="600">Credit_History</text>

  <!-- YES branch (approved path) -->
  <path d="M430 400 C400 330, 330 290, 250 240" stroke="url(#branchYes)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M250 240 C210 210, 195 190, 185 160" stroke="url(#branchYes)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M250 240 C270 205, 285 185, 300 155" stroke="url(#branchYes)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- NO branch (rejected path) -->
  <path d="M430 400 C470 330, 560 300, 660 270" stroke="url(#branchNo)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M660 270 C700 250, 715 235, 725 210" stroke="url(#branchNo)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- approved seals -->
  <circle cx="178" cy="140" r="34" fill="url(#seal)"/>
  <circle cx="178" cy="140" r="34" fill="none" stroke="#FFE3C2" stroke-width="2" stroke-dasharray="3 4" opacity="0.7"/>
  <path d="M164 140 l10 10 l20 -22" stroke="#3A1D02" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="304" cy="132" r="26" fill="url(#seal)"/>
  <path d="M294 132 l7 7 l14 -15" stroke="#3A1D02" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="176" width="150" height="34" rx="17" fill="#20233F" stroke="#F97316" stroke-opacity="0.4"/>
  <text x="195" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#FDBA74" font-weight="700">~80% approved</text>

  <!-- rejected seal -->
  <circle cx="722" cy="192" r="26" fill="url(#sealCool2)"/>
  <path d="M712 182 l20 20 M732 182 l-20 20" stroke="#0F1626" stroke-width="4" stroke-linecap="round"/>

  <rect x="640" y="222" width="150" height="34" rx="17" fill="#20233F" stroke="#7C93B8" stroke-opacity="0.4"/>
  <text x="715" y="244" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#B9CDE5" font-weight="700">~8% approved</text>

  <!-- SHAP waterfall, rising steps -->
  <g font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">
    <rect x="900" y="560" width="130" height="22" rx="5" fill="#38C0FF" fill-opacity="0.55"/>
    <text x="900" y="552">Married</text>

    <rect x="1010" y="508" width="150" height="22" rx="5" fill="#38C0FF" fill-opacity="0.7"/>
    <text x="1010" y="500">Property_Area</text>

    <rect x="1140" y="452" width="170" height="22" rx="5" fill="#38C0FF" fill-opacity="0.85"/>
    <text x="1140" y="444">LoanAmount</text>

    <rect x="1290" y="392" width="190" height="22" rx="5" fill="url(#branchYes)"/>
    <text x="1290" y="384" fill="#FDBA74">ApplicantIncome</text>

    <rect x="1120" y="330" width="360" height="30" rx="7" fill="url(#branchYes)"/>
    <text x="1300" y="351" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#3A1D02" font-weight="700">Credit_History — dominant driver</text>
  </g>
  <path d="M900 560 L1030 508 L1160 452 L1310 392 L1300 330" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="2 5" fill="none"/>

  <!-- final verdict badge -->
  <g>
    <circle cx="1300" cy="230" r="76" fill="#20233F" stroke="#F97316" stroke-width="2"/>
    <circle cx="1300" cy="230" r="76" fill="none" stroke="#F97316" stroke-opacity="0.25" stroke-width="10"/>
    <text x="1300" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#FDBA74">83.74%</text>
    <text x="1300" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">RF Accuracy</text>
    <text x="1300" y="266" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5D77A0">0.7955 AUC</text>
  </g>

  <!-- title -->
  <text x="800" y="756" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#E8ECFF">Loan Prediction — Decision Tree &amp; Random Forest</text>
  <text x="800" y="784" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#8893B8">614 applicants · SHAP-explained · Credit History as top predictor</text>
</svg>
