<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14162A"/>
      <stop offset="100%" stop-color="#0C0D14"/>
    </linearGradient>
    <linearGradient id="barA" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C2D3B"/>
      <stop offset="100%" stop-color="#C23B54"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D8C27A"/>
      <stop offset="100%" stop-color="#F0E4B8"/>
    </linearGradient>
    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C23B54" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C23B54" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1280" y1="0" x2="1280" y2="800"/>
  </g>

  <!-- window chrome -->
  <rect x="120" y="120" width="1360" height="560" rx="16" fill="#1C1F3A" stroke="#2A2F5C" stroke-width="1.5"/>
  <rect x="120" y="120" width="1360" height="56" rx="16" fill="#1C1F3A"/>
  <rect x="120" y="160" width="1360" height="16" fill="#1C1F3A"/>
  <circle cx="156" cy="148" r="7" fill="#FF5F57"/>
  <circle cx="180" cy="148" r="7" fill="#FEBC2E"/>
  <circle cx="204" cy="148" r="7" fill="#28C840"/>
  <text x="800" y="153" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#8893B8">wine_quality_analysis.R — EDA → t-test → Bootstrap</text>

  <!-- left panel: stage list -->
  <g font-family="ui-monospace, monospace" font-size="16" fill="#8893B8">
    <rect x="152" y="204" width="220" height="400" rx="10" fill="#14162A" stroke="#2A2F5C"/>
    <rect x="172" y="228" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="250">01  Load Data</text>
    <rect x="172" y="274" width="180" height="34" rx="8" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.4"/>
    <text x="188" y="296" fill="#FF9A4D" font-weight="600">02  Correlation</text>
    <rect x="172" y="320" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="342">03  t-test</text>
    <rect x="172" y="366" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="388">04  Bootstrap</text>
    <rect x="172" y="412" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="434">05  Tidyverse</text>
    <rect x="172" y="458" width="180" height="34" rx="8" fill="#20233F"/>
    <text x="188" y="480">06  Report.Rmd</text>
  </g>

  <!-- correlation heatmap -->
  <g>
    <text x="424" y="222" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">Correlation Matrix</text>
    <g transform="translate(424,236)">
      <rect x="0" y="0" width="44" height="44" fill="#F97316" fill-opacity="0.9"/>
      <rect x="44" y="0" width="44" height="44" fill="#F97316" fill-opacity="0.55"/>
      <rect x="88" y="0" width="44" height="44" fill="#38C0FF" fill-opacity="0.25"/>
      <rect x="132" y="0" width="44" height="44" fill="#38C0FF" fill-opacity="0.5"/>
      <rect x="0" y="44" width="44" height="44" fill="#F97316" fill-opacity="0.55"/>
      <rect x="44" y="44" width="44" height="44" fill="#F97316" fill-opacity="0.9"/>
      <rect x="88" y="44" width="44" height="44" fill="#38C0FF" fill-opacity="0.35"/>
      <rect x="132" y="44" width="44" height="44" fill="#38C0FF" fill-opacity="0.6"/>
      <rect x="0" y="88" width="44" height="44" fill="#38C0FF" fill-opacity="0.25"/>
      <rect x="44" y="88" width="44" height="44" fill="#38C0FF" fill-opacity="0.35"/>
      <rect x="88" y="88" width="44" height="44" fill="#F97316" fill-opacity="0.9"/>
      <rect x="132" y="88" width="44" height="44" fill="#F97316" fill-opacity="0.4"/>
      <rect x="0" y="132" width="44" height="44" fill="#38C0FF" fill-opacity="0.5"/>
      <rect x="44" y="132" width="44" height="44" fill="#38C0FF" fill-opacity="0.6"/>
      <rect x="88" y="132" width="44" height="44" fill="#F97316" fill-opacity="0.4"/>
      <rect x="132" y="132" width="44" height="44" fill="#F97316" fill-opacity="0.9"/>
      <rect x="0" y="0" width="176" height="176" fill="none" stroke="#2A2F5C" stroke-width="1.5"/>
      <line x1="44" y1="0" x2="44" y2="176" stroke="#0C0D14" stroke-width="1.5"/>
      <line x1="88" y1="0" x2="88" y2="176" stroke="#0C0D14" stroke-width="1.5"/>
      <line x1="132" y1="0" x2="132" y2="176" stroke="#0C0D14" stroke-width="1.5"/>
      <line x1="0" y1="44" x2="176" y2="44" stroke="#0C0D14" stroke-width="1.5"/>
      <line x1="0" y1="88" x2="176" y2="88" stroke="#0C0D14" stroke-width="1.5"/>
      <line x1="0" y1="132" x2="176" y2="132" stroke="#0C0D14" stroke-width="1.5"/>
    </g>
  </g>

  <!-- red vs white comparison bars -->
  <g>
    <text x="700" y="222" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">Alcohol · Red vs White</text>
    <rect x="700" y="380" width="46" height="130" rx="5" fill="url(#barA)"/>
    <rect x="754" y="340" width="46" height="170" rx="5" fill="url(#barB)"/>
    <text x="723" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">Red</text>
    <text x="777" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">White</text>

    <text x="860" y="222" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">Volatile Acidity</text>
    <rect x="860" y="360" width="46" height="150" rx="5" fill="url(#barA)"/>
    <rect x="914" y="440" width="46" height="70" rx="5" fill="url(#barB)"/>
    <text x="883" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">Red</text>
    <text x="937" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">White</text>
  </g>

  <!-- bootstrap distribution curve -->
  <g>
    <text x="1024" y="222" font-family="ui-monospace, monospace" font-size="13" fill="#8893B8">Bootstrap Distribution</text>
    <path d="M1024 500 Q1064 380 1104 500 T1184 500" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
    <path d="M1024 500 Q1064 380 1104 500 T1184 500 L1184 520 L1024 520 Z" fill="url(#curveFill)"/>
    <rect x="1080" y="420" width="48" height="100" fill="#F97316" fill-opacity="0.18" stroke="#F97316" stroke-opacity="0.4" stroke-dasharray="3 4"/>
    <line x1="1024" y1="520" x2="1184" y2="520" stroke="#2A2F5C" stroke-width="1.5"/>
    <text x="1104" y="546" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8893B8">95% CI</text>
  </g>

  <!-- insight card -->
  <g>
    <rect x="700" y="560" width="484" height="0" rx="14" fill="none"/>
    <rect x="424" y="576" width="756" height="0" fill="none"/>
  </g>
  <g>
    <rect x="1224" y="204" width="176" height="400" rx="10" fill="#20233F" stroke="#2A2F5C"/>
    <circle cx="1256" cy="240" r="10" fill="#F97316"/>
    <path d="M1251 240 l4 4 l8 -9" stroke="#0C0D14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1276" y="245" font-family="ui-monospace, monospace" font-size="14" fill="#E8ECFF" font-weight="600">p &lt; 0.001</text>
    <text x="1246" y="278" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">Alcohol content</text>
    <text x="1246" y="298" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">strongest predictor</text>
    <text x="1246" y="318" font-family="ui-monospace, monospace" font-size="12" fill="#8893B8">of quality rating</text>
    <rect x="1246" y="340" width="118" height="26" rx="13" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.4"/>
    <text x="1305" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#FF9A4D">6,400+ samples</text>
  </g>

  <!-- title -->
  <text x="800" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#E8ECFF">Statistical Analysis of Wine Quality</text>
</svg>
